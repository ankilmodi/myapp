<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="5">
  <title>NSE F&O Scanner — Loading...</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #0a0f1e;
      color: #e5e7eb;
      font-family: Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .box { text-align: center; }
    h1 { font-size: 2rem; color: #3b82f6; margin-bottom: 12px; }
    p { color: #9ca3af; font-size: 1rem; }
    .spinner {
      width: 56px; height: 56px;
      border: 5px solid #1e2d40;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .badge {
      display: inline-block;
      background: rgba(16,185,129,0.2);
      color: #10b981;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: .75rem;
      font-weight: 600;
      border: 1px solid #10b981;
      margin-bottom: 20px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
  </style>
</head>
<body>
  <div class="box">
    <span class="badge">⬤ STARTING UP</span>
    <div class="spinner"></div>
    <h1>📈 NSE F&amp;O Best Buy Scanner</h1>
    <p>Scanning 289 F&amp;O stocks across all indicators...</p>
    <p>Dashboard will be ready in ~60 seconds.</p>
    <p style="font-size:.8rem;margin-top:16px;color:#6b7280">
      Page auto-refreshes every 5 seconds.
    </p>
  </div>
</body>
</html>
